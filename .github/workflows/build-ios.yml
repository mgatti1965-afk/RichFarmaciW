name: Build Native iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Kotlin Shared Framework
        run: ./gradlew :shared:assembleSharedReleaseFramework --no-daemon

      - name: Build iOS Simulator App
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
                     -scheme iosApp \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     ONLY_ACTIVE_ARCH=NO

      - name: Zip iOS Simulator App
        run: |
          cd build/DerivedData/Build/Products/Release-iphonesimulator
          zip -r ../../../../../iosApp.app.zip iosApp.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iosApp.app.zip
          path: iosApp.app.zip
