<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RichFarmaci</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="app_icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <!-- iOS Apple Fullscreen Standalone App Specs -->
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RichFarmaci">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #ComposeTarget {
            width: 100vw;
            height: 100vh;
            display: block;
            border: none;
            outline: none;
        }
        #error-log {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            background: rgba(220, 38, 38, 0.95);
            color: white;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            overflow: auto;
            z-index: 99999;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="error-log"></div>
    <canvas id="ComposeTarget"></canvas>
    <script>
        function logError(msg) {
            console.error(msg);
            var el = document.getElementById('error-log');
            if (el) {
                el.style.display = 'block';
                el.innerText += '\n' + msg;
            }
        }
        window.onerror = function(message, source, lineno, colno, error) {
            logError('[ERROR] ' + message + ' (' + source + ':' + lineno + ')');
            return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
            logError('[PROMISE REJECTION] ' + (event.reason ? (event.reason.stack || event.reason) : event));
        });
    </script>
    <script type="application/javascript" src="skiko.js"></script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
